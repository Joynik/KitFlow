name: Box version

on:
  push:
    branches: [main]
    paths:
      - 'box/**'
      - '!box/.version'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: box-version
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: bash scripts/update_box_version.sh
