name: Release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  # For a manual retry, select the existing release tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate release metadata
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Version must use MAJOR.MINOR.PATCH without a prefix')
          if os.environ['REF_TYPE'] != 'tag':
              raise SystemExit('Select a release tag to run this workflow')
          if os.environ['REF_NAME'] != version:
              raise SystemExit('Tag does not match the package version')
          changelog = Path('CHANGELOG.md').read_text()
          if not re.search(r'^## ' + re.escape(version) + r' — \d{4}-\d{2}-\d{2}$', changelog, re.M):
              raise SystemExit('Prepare a dated changelog section before releasing')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PYTHON

  checks:
    needs: prepare
    uses: ./.github/workflows/checks.yml

  build:
    needs: [prepare, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: '3.14'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf ccache
      - run: uv sync --locked --group build
      - name: Build standalone archive
        run: uv run --no-sync python scripts/build_standalone.py --jobs 3
      - name: Verify relocated archive
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf dist/kitflow-*-${{ matrix.platform }}.tar.gz -C "$smoke_dir"
          mkdir "$smoke_dir/project"
          "$smoke_dir/kitflow/kitflow" -v
          uv run --no-sync python scripts/smoke_tui.py "$smoke_dir/kitflow/kitflow"
          uv run --no-sync python scripts/smoke_templates.py "$smoke_dir/kitflow/kitflow"
          "$smoke_dir/kitflow/kitflow" init -b "$GITHUB_WORKSPACE/box" -p "$smoke_dir/project" -c python,ruff -y
          "$smoke_dir/kitflow/kitflow" status --box "$GITHUB_WORKSPACE/box" --project "$smoke_dir/project"
          "$smoke_dir/kitflow/kitflow" check -b "$GITHUB_WORKSPACE/box" -p "$smoke_dir/project"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: standalone-${{ matrix.platform }}
          path: dist/kitflow-*-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: standalone-*
          path: release-assets
          merge-multiple: true
      - name: Publish release for the pushed tag
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os
          import tarfile
          from pathlib import Path
          version = os.environ['RELEASE_TAG']
          expected = {f'kitflow-{version}-{platform}.tar.gz' for platform in ('macos-arm64', 'linux-arm64', 'linux-x86_64')}
          archives = list(Path('.').glob('*.tar.gz'))
          if {path.name for path in archives} != expected:
              raise SystemExit('Expected exactly three release archives for this version')
          for path in archives:
              with tarfile.open(path) as archive:
                  if 'kitflow/kitflow' not in archive.getnames():
                      raise SystemExit(f'Missing executable in {path}')
          changelog = Path('../CHANGELOG.md').read_text()
          section = changelog.split(f'## {version} — ', 1)[1].split('\n', 1)[1].split('\n## ', 1)[0]
          Path('../release-notes.md').write_text(section.strip() + '\n')
          PYTHON
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          sha256sum ./*.tar.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --verify-tag --title "$RELEASE_TAG" --notes-file ../release-notes.md --latest

  homebrew:
    needs: [prepare, release]
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit
