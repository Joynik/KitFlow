# Tasks
# Fragments with the same name compose one task; their relative order is preserved.

# Tasks: help and local environment

[[tasks]]
id = "help"
name = "help"
template = "tasks/help.sh"
when = []
alias = "default"
quiet = true
description = "List project tasks and descriptions"

[[tasks]]
id = "env-local"
name = "env:local"
template = "tasks/env-local.sh"
when = []
description = "Create .env from the example without replacing an existing file"

# Tasks: combined checks

[[tasks]]
id = "check-lint"
name = "check"
template = "tasks/check-lint.sh"
when = []
description = "Check code, formatting, types and migrations"
when_any = ["ruff", "django", "djlint", "rumdl", "rust", "bun", "swiftlint"]

[[tasks]]
id = "check-format"
name = "check"
template = "tasks/check-format-check.sh"
when = []
description = "Check code, formatting, types and migrations"
when_any = ["ruff", "rust", "bun", "rumdl", "djlint", "swift"]

[[tasks]]
id = "check-types"
name = "check"
template = "tasks/check-typecheck.sh"
when = []
description = "Check code, formatting, types and migrations"
when_any = ["ty", "mypy", "rust", "swift"]

[[tasks]]
id = "check-typescript"
name = "check"
template = "tasks/check-typecheck.sh"
when = ["typescript", "bun"]
description = "Check code, formatting, types and migrations"

[[tasks]]
id = "check-migrations"
name = "check"
template = "tasks/check-migrations.sh"
when = []
description = "Check code, formatting, types and migrations"
when_any = ["django", "alembic"]

[[tasks]]
id = "verify-code"
name = "verify"
template = "tasks/verify-check.sh"
when = []
description = "Run checks, application checks and tests sequentially"
when_any = ["alembic", "bun", "django", "djlint", "ruff", "rumdl", "rust", "swift", "swiftlint", "ty", "mypy", "prisma"]

[[tasks]]
id = "verify-app"
name = "verify"
template = "tasks/check-app.sh"
when = []
description = "Run checks, application checks and tests sequentially"
when_any = ["django", "fastapi", "flask"]

[[tasks]]
id = "verify-tests"
name = "verify"
template = "tasks/verify-test.sh"
when = []
description = "Run checks, application checks and tests sequentially"
when_any = ["pytest", "unittest", "django-tests", "bun-tests", "rust-tests", "swift-tests"]

