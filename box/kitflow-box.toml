conflicts = []

# Components: databases

[[components]]
id = "postgresql"
label = "PostgreSQL"
category = "Databases"
description = "Database selection only; backup commands require connection configuration."
requires = []
conflicts = ["sqlite"]

[[components]]
id = "sqlite"
label = "SQLite"
category = "Databases"
description = "Database selection without server installation."
requires = []
conflicts = ["postgresql"]

# Components: data access

[[components]]
id = "prisma"
label = "Prisma ORM"
category = "Data access"
description = "Prisma ORM 7 schema, client generation and explicit migrations; select PostgreSQL or SQLite."
requires = ["bun"]
conflicts = []
when = ["javascript"]
when_any = ["postgresql", "sqlite"]

# Components: infrastructure

[[components]]
