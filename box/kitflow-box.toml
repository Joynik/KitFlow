# Files: project documents

[[files]]
id = "readme"
path = "README.md"
empty = true
when = []
mode = "once"

[[files]]
id = "project"
path = "PROJECT.md"
empty = true
when = ["agents"]
mode = "once"

# Files: shared configuration

[[files]]
id = "gitignore"
path = ".gitignore"
mode = "managed"
fragments = [
  { template = "templates/gitignore/general.txt" },
  { template = "templates/gitignore/agents.txt", when = ["agents"] },
  { template = "templates/gitignore/prisma.txt", when = ["prisma"] },
  { template = "templates/gitignore/python.txt", when = ["python"] },
  { template = "templates/gitignore/javascript.txt", when = ["javascript"] },
  { template = "templates/gitignore/rust.txt", when = ["rust"] },
  { template = "templates/gitignore/swift.txt", when = ["swift"] },
  { template = "templates/gitignore/django.txt", when = ["django"] },
  { template = "templates/gitignore/nextjs.txt", when = ["nextjs"] },
  { template = "templates/gitignore/nuxt.txt", when = ["nuxt"] },
  { template = "templates/gitignore/sveltekit.txt", when = ["sveltekit"] },
  { template = "templates/gitignore/astro.txt", when = ["astro"] },
  { template = "templates/gitignore/tauri.txt", when = ["tauri"] },
  { template = "templates/gitignore/sqlite.txt", when = ["sqlite"] },
  { template = "templates/gitignore/ruff.txt", when = ["ruff"] },
  { template = "templates/gitignore/mypy.txt", when = ["mypy"] },
  { template = "templates/gitignore/rumdl.txt", when = ["rumdl"] },
  { template = "templates/gitignore/database.txt", when_any = ["postgresql", "sqlite"] },
  { template = "templates/gitignore/tests.txt", when_any = ["pytest", "unittest", "django-tests"] },
]

[[files]]
id = "env-example"
path = ".env.example"
mode = "managed"
format = "dotenv"
fragments = [
  { template = "templates/env/general.env" },
  { template = "templates/env/python-application.env", when_any = ["django", "fastapi", "flask"] },
  { template = "templates/env/django.env", when = ["django"] },
  { template = "templates/env/fastapi.env", when = ["fastapi"] },
  { template = "templates/env/flask.env", when = ["flask"] },
  { template = "templates/env/server.env", when_any = ["granian", "gunicorn", "uvicorn"] },
  { template = "templates/env/gunicorn.env", when = ["gunicorn"] },
  { template = "templates/env/granian.env", when = ["granian"] },
  { template = "templates/env/database-operations.env", when_any = ["sqlite", "postgresql"] },
  { template = "templates/env/postgresql.env", when = ["postgresql"] },
  { template = "templates/env/sqlite.env", when = ["sqlite"] },
  { template = "templates/env/rust.env", when_any = ["axum", "actix-web"] },
  { template = "templates/env/prisma.env", when = ["prisma"] },
]

# Files: Docker build context

[[files]]
id = "dockerignore"
path = ".dockerignore"
mode = "managed"
when = ["docker"]
fragments = [
  { template = "templates/dockerignore/general.txt" },
  { template = "templates/dockerignore/agents.txt", when = ["agents"] },
  { template = "templates/dockerignore/prisma.txt", when = ["prisma"] },
  { template = "templates/dockerignore/python.txt", when = ["python"] },
  { template = "templates/dockerignore/javascript.txt", when = ["javascript"] },
  { template = "templates/dockerignore/rust.txt", when = ["rust"] },
  { template = "templates/dockerignore/swift.txt", when = ["swift"] },
  { template = "templates/dockerignore/django.txt", when = ["django"] },
  { template = "templates/dockerignore/nextjs.txt", when = ["nextjs"] },
  { template = "templates/dockerignore/nuxt.txt", when = ["nuxt"] },
  { template = "templates/dockerignore/sveltekit.txt", when = ["sveltekit"] },
  { template = "templates/dockerignore/astro.txt", when = ["astro"] },
  { template = "templates/dockerignore/tauri.txt", when = ["tauri"] },
  { template = "templates/dockerignore/ruff.txt", when = ["ruff"] },
  { template = "templates/dockerignore/mypy.txt", when = ["mypy"] },
  { template = "templates/dockerignore/rumdl.txt", when = ["rumdl"] },
  { template = "templates/dockerignore/database.txt", when_any = ["postgresql", "sqlite"] },
  { template = "templates/dockerignore/sqlite.txt", when = ["sqlite"] },
  { template = "templates/dockerignore/tests.txt", when_any = ["pytest", "unittest", "django-tests"] },
]

