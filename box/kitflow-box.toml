# KitFlow catalog: all paths are relative to this directory.
schema = 4

# Components: languages

[[components]]
id = "python"
label = "Python"
category = "Languages"
description = "Base Python project files."
requires = []
conflicts = []

[[components]]
id = "javascript"
label = "JavaScript"
category = "Languages"
description = "Project language; select checks separately."
requires = []
conflicts = []

[[components]]
id = "typescript"
label = "TypeScript"
category = "Languages"
description = "Project language; select checks separately."
requires = ["javascript"]
conflicts = []
when = []

[[components]]
id = "rust"
label = "Rust"
category = "Languages"
description = "Cargo checks, builds and formatting in the configured Rust directory."
requires = []
conflicts = []

[[components]]
