[mypy]
# Check bodies of functions without annotations, without requiring annotations everywhere.
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

# Keep diagnostics compact without suppressing errors or missing-import checks.
pretty = false
error_summary = false
show_error_context = false
show_error_codes = true

# Match generated directories during recursive discovery.
exclude = (?x)(^|/)(\.venv|venv|node_modules|target|build|dist|\.build)/
