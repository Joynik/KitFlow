[vars]
# Docker files directory, relative to mise.toml or absolute.
docker_source = "."
compose_file = "compose.yml"
compose_env_file = ".env"
compose_wrapper = ""
database_docker_service = "db"
sqlite_container_path = "/app/db.sqlite3"

[env]
DOCKER_SOURCE = '{{ [config_root, env.DOCKER_SOURCE | default(value=vars.docker_source)] | join_path | absolute }}'
COMPOSE_FILE = '{{ [env.DOCKER_SOURCE | default(value=config_root), env.COMPOSE_FILE | default(value=vars.compose_file)] | join_path | absolute }}'
COMPOSE_ENV_FILE = '{{ [config_root, env.COMPOSE_ENV_FILE | default(value=vars.compose_env_file)] | join_path | absolute }}'
COMPOSE_WRAPPER = '{% set path = env.COMPOSE_WRAPPER | default(value=vars.compose_wrapper) %}{% if path %}{{ [config_root, path] | join_path | absolute }}{% endif %}'
DATABASE_DOCKER_SERVICE = "{{ env.DATABASE_DOCKER_SERVICE | default(value=vars.database_docker_service) }}"
SQLITE_CONTAINER_PATH = "{{ env.SQLITE_CONTAINER_PATH | default(value=vars.sqlite_container_path) }}"
