[vars]
# native or docker; restore requires application writes to be stopped.
database_target = "native"
database_sqlite_path = "db.sqlite3"
database_backup_file = "backup.sql"
database_restore_file = ""
database_init_sql = ""

[env]
DATABASE_TARGET = "{{ env.DATABASE_TARGET | default(value=vars.database_target) }}"
DATABASE_SQLITE_PATH = "{{ config_root }}/{{ vars.database_sqlite_path }}"
DATABASE_BACKUP_FILE = "{{ env.DATABASE_BACKUP_FILE | default(value=vars.database_backup_file) }}"
DATABASE_RESTORE_FILE = "{{ env.DATABASE_RESTORE_FILE | default(value=vars.database_restore_file) }}"
DATABASE_INIT_SQL = "{{ env.DATABASE_INIT_SQL | default(value=vars.database_init_sql) }}"
