[settings]
task.run_auto_install = false
task.quiet = true

[env]
# kitflow:begin env.PYTHONUNBUFFERED
PYTHONUNBUFFERED = "1"
# kitflow:end env.PYTHONUNBUFFERED
_.file = ".env"
PROJECT_ROOT = "{{ [config_root, env.PROJECT_ROOT | default(value=vars.project_root)] | join_path | absolute }}"
PYTHON_SOURCE = "{{ [env.PROJECT_ROOT, env.PYTHON_SOURCE | default(value=vars.python_source)] | join_path | absolute }}"
PYTHON_TESTS = "{{ env.PYTHON_TESTS | default(value=vars.python_tests) }}"
PYTHON_ENTRYPOINT = "{{ env.PYTHON_ENTRYPOINT | default(value=vars.python_entrypoint) }}"
PYTHON_BUILD_DIRECTORY = "{{ env.PYTHON_BUILD_DIRECTORY | default(value=vars.python_build_directory) }}"

[vars]
project_root = "."  # Relative to mise.toml; absolute paths are also allowed.
python_source = "."  # Relative to project_root; use "." for the project folder.
python_tests = "tests"  # Relative to project_root; absolute paths are also allowed.
python_entrypoint = "main.py"  # Entry file, relative to project_root.
python_build_directory = "dist"  # Output folder, relative to project_root.

# kitflow:begin task.help
[tasks."help"]
description = "List project tasks and descriptions"
alias = "default"
quiet = true
run = '''
set -eu
mise tasks ls
'''
# kitflow:end task.help

# kitflow:begin task.check
[tasks."check"]
description = "Check code, formatting, types and migrations"
run = '''
set -eu
if [ "${kitflow_checked_lint:-0}" != 1 ]; then
    mise run --quiet lint
    kitflow_checked_lint=1
fi
if [ "${kitflow_checked_format_check:-0}" != 1 ]; then
    mise run --quiet format-check
    kitflow_checked_format_check=1
fi
if [ "${kitflow_checked_typecheck:-0}" != 1 ]; then
    mise run --quiet typecheck
    kitflow_checked_typecheck=1
fi
'''
# kitflow:end task.check

# kitflow:begin task.verify
[tasks."verify"]
description = "Run checks, application checks and tests sequentially"
run = '''
set -eu
if [ "${kitflow_verified_check:-0}" != 1 ]; then
    mise run --quiet check
    kitflow_verified_check=1
fi
if [ "${kitflow_verified_test:-0}" != 1 ]; then
    mise run --quiet test
    kitflow_verified_test=1
fi
'''
# kitflow:end task.verify

# kitflow:begin task.lint
[tasks."lint"]
description = "Lint selected project components"
run = '''
set -eu
(
cd "${PYTHON_SOURCE:?Set PYTHON_SOURCE in mise.toml}"
ruff check . --output-format concise
)
rumdl check . --output-format concise --quiet
'''
# kitflow:end task.lint

# kitflow:begin task.lint-fix
[tasks."lint-fix"]
description = "Apply supported lint fixes"
run = '''
set -eu
(
cd "${PYTHON_SOURCE:?Set PYTHON_SOURCE in mise.toml}"
ruff check . --fix --output-format concise
)
rumdl check . --fix --output-format concise --quiet
'''
# kitflow:end task.lint-fix

# kitflow:begin task.format
[tasks."format"]
description = "Format selected project components"
run = '''
set -eu
(
cd "${PYTHON_SOURCE:?Set PYTHON_SOURCE in mise.toml}"
ruff format .
)
rumdl fmt . --output-format concise --quiet
'''
# kitflow:end task.format

# kitflow:begin task.format-check
[tasks."format-check"]
description = "Check formatting without applying fixes"
run = '''
set -eu
(
cd "${PYTHON_SOURCE:?Set PYTHON_SOURCE in mise.toml}"
ruff format . --check
)
rumdl fmt . --check --output-format concise --quiet
'''
# kitflow:end task.format-check

# kitflow:begin task.typecheck
[tasks."typecheck"]
description = "Check selected project types and native builds"
run = '''
set -eu
(
cd "${PYTHON_SOURCE:?Set PYTHON_SOURCE in mise.toml}"
ty check . --output-format concise
)
'''
# kitflow:end task.typecheck

# kitflow:begin task.test
[tasks."test"]
description = "Run selected test runners"
run = '''
set -eu
(
cd "${PROJECT_ROOT:?Set PROJECT_ROOT in mise.toml}"
uv run pytest "${PYTHON_TESTS:-tests}" --quiet
)
'''
# kitflow:end task.test

# kitflow:begin task.build
[tasks."build"]
description = "Build selected project components"
run = '''
set -eu
(
cd "${PROJECT_ROOT:?Set PROJECT_ROOT in mise.toml}"
uv run --no-sync python -m nuitka --mode=standalone \
    --output-dir="${PYTHON_BUILD_DIRECTORY:-dist}" \
    "${PYTHON_ENTRYPOINT:?Set PYTHON_ENTRYPOINT in mise.toml or .env}"
)
'''
# kitflow:end task.build

# kitflow:begin task.check-unused
[tasks."check-unused"]
description = "Find potentially unused code and files"
run = '''
set -eu
(
cd "${PROJECT_ROOT:?Set PROJECT_ROOT in mise.toml}"
source_dir="${PYTHON_SOURCE:-.}"
tests_dir="${PYTHON_TESTS:-tests}"
set -- "$source_dir"
if [ "$source_dir" != "." ] && [ "$source_dir" != "$PWD" ] && [ -d "$tests_dir" ]; then
  set -- "$@" "$tests_dir"
fi
uv run --no-sync vulture "$@" --config pyproject.toml
)
'''
# kitflow:end task.check-unused

# kitflow:begin task.check-deps
[tasks."check-deps"]
description = "Check declared dependencies"
run = '''
set -eu
(
cd "${PROJECT_ROOT:?Set PROJECT_ROOT in mise.toml}"
status=0
output=$(uv run --no-sync deptry --no-ansi . 2>&1) || status=$?
printf '%s\n' "$output" | awk '
  /^Scanning [0-9]+ files?\.\.\.$/ { next }
  /^For more information, see the documentation: https:\/\/deptry\.com\/$/ { next }
  NF
'
(exit "$status")
)
'''
# kitflow:end task.check-deps

# kitflow:begin task.env:local
[tasks."env:local"]
description = "Create .env from the example without replacing an existing file"
run = '''
set -eu
if [ -e .env ] || [ -L .env ]; then
    echo ".env already exists; edit it manually" >&2
    exit 2
fi
(set -C; cat .env.example > .env)
'''
# kitflow:end task.env:local
