[settings]
task.run_auto_install = false

[tasks.typecheck]
description = "Check Python types"
run = "ty check ."

[tasks.format]
description = "Format Python code and Markdown documentation"
run = [
  "ruff format src tests scripts",
  "rumdl fmt .",
]

[tasks.build]
description = "Build the KitFlow standalone archive for this platform"
run = "uv run --locked --group build python scripts/build_standalone.py"
