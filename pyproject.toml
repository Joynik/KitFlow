[project]
name = "kitflow"
version = "0.7.0"
description = "Declarative project standards and composed mise tasks"
requires-python = ">=3.14"
authors = [{ name = "Joynik", email = "joynik@gmail.com" }]
dependencies = [
  "certifi>=2026.10.23",
  "textual>=8.2.8",
  "tomlkit>=0.15.2",
]

[project.scripts]
kitflow = "kitflow.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.5.0",
  "ruff>=0.17.5",
  "ty>=0.0.104",
]
build = [
  "nuitka>=4.3.5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitflow"]

[tool.hatch.build.targets.wheel.force-include]
"docs/INSTRUCTION.md" = "kitflow/INSTRUCTION.md"

[tool.hatch.build.targets.sdist]
include = ["/src/kitflow", "/docs/INSTRUCTION.md", "/pyproject.toml", "/README.md"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
